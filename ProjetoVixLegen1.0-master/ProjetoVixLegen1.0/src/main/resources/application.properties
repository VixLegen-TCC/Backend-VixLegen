spring.application.name=ProjetoVixLegen1.0
spring.datasource.url=jdbc:mysql://localhost:3306/VixLegenDB?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:senaisp}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
# Em produção, defina JWT_SECRET no ambiente e não use a chave padrão de desenvolvimento.
jwt.secret=${JWT_SECRET:vixlegen-dev-jwt-secret-key-change-me-2026}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

# Frontend / cadastro público
app.frontend-origins=${FRONTEND_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
cadastro.categoria-padrao=${CADASTRO_CATEGORIA_PADRAO:Advogado Júnior}
